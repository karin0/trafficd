[package]
name = "trafficd"
version = "0.1.0"
authors = ["karin0 <karin0@gmx.com>"]
edition = "2024"

[dependencies]
actix-web = { version = "4", default-features = false, features = ["macros"] }
sqlx = { version = "0.8", features = ["sqlite", "macros", "runtime-tokio"] }
prost = "0.14.1"
log = "0.4"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
actix-cors = "0.7"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt", "macros"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
anyhow = "1"
xray-core = "0.2"
time = { version = "0.3", features = ["macros", "parsing"] }
pretty_env_logger = { git = "https://github.com/karin0/pretty-env-logger.git" }

[build-dependencies]
prost-build = "0.14.1"

[lints.rust]
warnings = 'deny'

[lints.clippy]
pedantic = { level = 'warn', priority = -1 }

# A panic in the refresh worker task would otherwise leave the server running
# without it, so every panic ends the process for the supervisor to restart.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
strip = true
lto = true
codegen-units = 1
