syntax = "proto3";

package traffic.proto;

message Row {
  uint64 tid = 1;
  uint64 time = 2;
  uint64 tx = 3;
  uint64 rx = 4;
}

message User {
  uint32 uid = 1;
  string name = 2;
}

// A calendar month or year in the timezone of trafficd
message Period {
  int32 year = 1;
  // 1 to 12, or 0 for the whole year
  uint32 month = 2;
  int64 since = 3;
  int64 until = 4;
}

message TrafficStats {
  repeated Row rows = 1;
  repeated User users = 2;
  Period period = 3;
}
